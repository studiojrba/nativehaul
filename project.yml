name: nativehaul
options:
  bundleIdPrefix: com.studiojrba
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
targets:
  nativehaul:
    type: application
    platform: macOS
    sources:
      - path: nativehaul
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.studiojrba.nativehaul
        INFOPLIST_FILE: nativehaul/App/Info.plist
        PRODUCT_NAME: nativehaul
        PRODUCT_MODULE_NAME: nativehaul
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: nativehaul
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Studio Jrba inc. MIT License."
        ENABLE_APP_SANDBOX: NO
        ENABLE_TESTABILITY: YES
  nativehaulTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: nativehaulTests
    dependencies:
      - target: nativehaul
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.studiojrba.nativehaulTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/nativehaul.app/Contents/MacOS/nativehaul"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  nativehaul:
    build:
      targets:
        nativehaul: all
        nativehaulTests: [test]
    test:
      targets:
        - nativehaulTests
      gatherCoverageData: true
