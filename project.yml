name: Playrite
options:
  bundleIdPrefix: com.studiojrba
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Playrite:
    type: application
    platform: macOS
    sources:
      - path: Playrite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.studiojrba.Playrite
        PRODUCT_NAME: Retriever
        PRODUCT_MODULE_NAME: Playrite
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Retriever
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_NSHumanReadableCopyright: "© studiojrba"
        ENABLE_APP_SANDBOX: NO
        ENABLE_TESTABILITY: YES
  PlayriteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PlayriteTests
    dependencies:
      - target: Playrite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.studiojrba.PlayriteTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Retriever.app/Contents/MacOS/Retriever"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Playrite:
    build:
      targets:
        Playrite: all
        PlayriteTests: [test]
    test:
      targets:
        - PlayriteTests
      gatherCoverageData: true
